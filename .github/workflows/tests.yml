name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test without live accounts or network calls
        run: python -m unittest discover -s tests -v
      - name: Compile Mail script on macOS
        if: runner.os == 'macOS'
        run: osacompile -o "$RUNNER_TEMP/send.scpt" send.applescript
